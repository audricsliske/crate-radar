<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Crate Radar</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d12'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%2300e5ff' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23a3ff12'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0b0d12;
      --card: #141821;
      --border: #232a38;
      --text: #f3f6fc;
      --muted: #8b96ab;
      --cyan: #00e5ff;
      --lime: #a3ff12;
      --purple: #b388ff;
      --amber: #ffab00;
      --sc-orange: #ff6e40;
      --audius-pink: #e040fb;
      --hearthis-teal: #1de9b6;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 64px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 13, 18, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 12px;
    }
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      max-width: 760px;
      margin: 0 auto 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 10px var(--lime);
    }
    .top-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .dig-btn {
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.22), rgba(163, 255, 18, 0.22));
      border: 1px solid var(--cyan);
      color: #ffffff;
      border-radius: 9px;
      padding: 6px 11px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .dig-btn:hover {
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.34), rgba(163, 255, 18, 0.34));
    }
    .dig-btn.spinning .spin-icon {
      display: inline-block;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .sync-btn {
      background: rgba(163, 255, 18, 0.14);
      border: 1px solid rgba(163, 255, 18, 0.45);
      color: var(--lime);
      border-radius: 9px;
      padding: 6px 10px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .sync-btn:hover { background: rgba(163, 255, 18, 0.22); }
    .import-btn {
      background: rgba(0, 229, 255, 0.12);
      border: 1px solid rgba(0, 229, 255, 0.4);
      color: var(--cyan);
      border-radius: 9px;
      padding: 6px 10px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .import-btn:hover { background: rgba(0, 229, 255, 0.2); }
    .status {
      font-size: 0.72rem;
      color: var(--muted);
      text-align: right;
    }
    .controls {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .search-row {
      display: flex;
      gap: 8px;
    }
    input[type="search"], input[type="password"] {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
      outline: none;
    }
    input[type="search"]:focus, input[type="password"]:focus {
      border-color: var(--cyan);
    }
    .toggle-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 0 11px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .toggle-btn.active {
      border-color: var(--amber);
      color: var(--amber);
    }
    .toggle-btn.active-cyan {
      border-color: var(--cyan);
      color: var(--cyan);
    }
    .pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .pills::-webkit-scrollbar { display: none; }
    .pill {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .pill.active {
      background: var(--cyan);
      color: #05070a;
      border-color: var(--cyan);
    }
    main {
      max-width: 760px;
      margin: 14px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .dig-drawer {
      background: #101520;
      border: 1px solid rgba(0, 229, 255, 0.4);
      border-radius: 13px;
      padding: 12px 14px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .dig-drawer.open {
      display: flex;
    }
    .dig-drawer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .dig-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .dig-action-btn {
      background: rgba(0, 229, 255, 0.14);
      border: 1px solid rgba(0, 229, 255, 0.45);
      color: var(--cyan);
      border-radius: 9px;
      padding: 7px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .dig-action-btn:hover { background: rgba(0, 229, 255, 0.24); }
    .dig-action-btn.primary {
      background: var(--lime);
      border-color: var(--lime);
      color: #05070a;
    }
    .dig-action-btn.primary:hover { opacity: 0.92; }
    .dig-action-btn.active-shuffle {
      background: rgba(179, 136, 255, 0.22);
      border-color: var(--purple);
      color: var(--purple);
    }
    .dig-status {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .dig-status strong { color: var(--lime); }
    .token-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .token-row input {
      padding: 7px 10px;
      font-size: 0.8rem;
      min-width: 210px;
    }
    .close-drawer {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
      padding: 2px 6px;
    }
    .close-drawer:hover { color: var(--text); }
    .summary-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
      padding: 0 2px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .synced-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .re-download-link, .reset-sync-link {
      background: none;
      border: none;
      color: var(--cyan);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      display: none;
    }
    .reset-sync-link {
      color: var(--muted);
      font-weight: 600;
    }
    .reset-sync-link:hover { color: var(--amber); }
    .re-download-link.visible, .reset-sync-link.visible { display: inline; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.15s ease;
    }
    .card:hover { border-color: #323c50; }
    .card.is-playing {
      border-color: var(--lime);
      box-shadow: 0 0 0 1px rgba(163, 255, 18, 0.25);
    }
    .card.is-duplicate {
      border-color: rgba(255, 171, 0, 0.35);
      background: rgba(20, 24, 33, 0.75);
    }
    .card.is-hidden { opacity: 0.55; }
    .meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.72rem;
    }
    .badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    .badge-hypeddit { background: rgba(0, 229, 255, 0.14); color: var(--cyan); }
    .badge-droploud { background: rgba(179, 136, 255, 0.16); color: var(--purple); }
    .badge-soundcloud { background: rgba(255, 110, 64, 0.16); color: var(--sc-orange); }
    .badge-audius { background: rgba(224, 64, 251, 0.16); color: var(--audius-pink); }
    .badge-hearthis { background: rgba(29, 233, 182, 0.16); color: var(--hearthis-teal); }
    .badge-genre { background: rgba(255, 255, 255, 0.07); color: var(--text); }
    .badge-edit { background: rgba(163, 255, 18, 0.15); color: var(--lime); }
    .badge-duplicate {
      background: rgba(255, 171, 0, 0.18);
      color: var(--amber);
      border: 1px solid rgba(255, 171, 0, 0.45);
    }
    .time { margin-left: auto; color: var(--muted); }
    .track-title {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.35;
      word-break: break-word;
    }
    .card.is-duplicate .track-title {
      color: #c7d0e0;
    }
    .player-box {
      background: #0d1017;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      overflow: hidden;
    }
    .player-box iframe {
      width: 100%;
      border: none;
      border-radius: 6px;
      display: block;
    }
    .player-box audio {
      width: 100%;
      height: 38px;
      display: block;
    }
    .fallback-listen {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: var(--muted);
      padding: 4px 2px;
    }
    .fallback-links {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .mini-link {
      background: #1b212e;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 0.76rem;
      font-weight: 700;
      text-decoration: none;
    }
    .mini-link:hover {
      border-color: var(--cyan);
      color: var(--cyan);
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 7px;
    }
    @media (max-width: 480px) {
      .actions {
        grid-template-columns: 1fr 1fr;
      }
    }
    .btn {
      border: 1px solid var(--border);
      background: #1b212e;
      color: var(--text);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn:active { transform: scale(0.98); }
    .btn-listen {
      background: rgba(163, 255, 18, 0.14);
      border-color: rgba(163, 255, 18, 0.4);
      color: var(--lime);
    }
    .btn-listen.playing {
      background: var(--lime);
      border-color: var(--lime);
      color: #05070a;
    }
    .btn-copy.copied {
      background: rgba(163, 255, 18, 0.2);
      border-color: var(--lime);
      color: var(--lime);
    }
    .btn-open {
      background: rgba(0, 229, 255, 0.12);
      border-color: rgba(0, 229, 255, 0.35);
      color: var(--cyan);
    }
    .btn-done {
      padding: 9px 12px;
      color: var(--muted);
    }
    .btn-done:hover { color: var(--text); }
    .empty {
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 28px 18px;
      text-align: center;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.9rem;
    }
    .empty strong { color: var(--text); display: block; margin-bottom: 6px; font-size: 1rem; }
  </style>
</head>
<body>
  <header>
    <div class="top-row">
      <div class="brand"><span class="dot"></span> CRATE RADAR</div>
      <div class="top-right">
        <button class="dig-btn" id="digMoreBtn" title="Refresh feed, shuffle crate, or run a live scrape"><span class="spin-icon">↻</span> Dig More</button>
        <button class="sync-btn" id="syncFolderBtn" title="Scans a folder and merges its tracks">+ Sync Folder</button>
        <button class="import-btn" id="importJsonBtn" title="Load an existing owned_tracks.json file">Import JSON</button>
        <input type="file" id="folderPicker" webkitdirectory directory multiple hidden />
        <input type="file" id="jsonPicker" accept=".json,application/json" hidden />
        <div class="status" id="lastUpdated">Loading...</div>
      </div>
    </div>

    <div class="controls">
      <div class="search-row">
        <input type="search" id="searchInput" placeholder="Search artist, dancehall, flip, edit..." />
        <button class="toggle-btn" id="toggleDupesBtn">Hide Dupes (0)</button>
        <button class="toggle-btn" id="toggleHiddenBtn">Done (0)</button>
      </div>
      <div class="pills" id="filterPills">
        <button class="pill active" data-filter="ALL">All</button>
        <button class="pill" data-filter="Dancehall">Dancehall</button>
        <button class="pill" data-filter="Dubstep">Dubstep</button>
        <button class="pill" data-filter="Trap">Trap</button>
        <button class="pill" data-filter="Afro House">Afro House</button>
        <button class="pill" data-filter="EDITS">Flips &amp; Edits</button>
        <button class="pill" data-filter="DUPLICATES">Duplicates</button>
        <button class="pill" data-filter="SoundCloud">SoundCloud</button>
        <button class="pill" data-filter="Hypeddit">Hypeddit</button>
        <button class="pill" data-filter="Droploud">Droploud</button>
        <button class="pill" data-filter="Audius">Audius</button>
        <button class="pill" data-filter="Hearthis">Hearthis</button>
      </div>
    </div>
  </header>

  <main>
    <div class="dig-drawer" id="digDrawer">
      <div class="dig-drawer-top">
        <div class="dig-actions">
          <button class="dig-action-btn primary" id="triggerLiveScrapeBtn">⚡ Pull Fresh Drops Now</button>
          <button class="dig-action-btn" id="shuffleCrateBtn">🎲 Shuffle Crate</button>
          <a class="dig-action-btn" href="https://github.com/audricsliske/crate-radar/actions/workflows/scan.yml" target="_blank" rel="noopener noreferrer">GitHub Actions &nearr;</a>
        </div>
        <button class="close-drawer" id="closeDigDrawerBtn" title="Close">✕</button>
      </div>
      <div class="dig-status" id="digStatusText">
        Feed refreshed. Click <b>⚡ Pull Fresh Drops Now</b> to run a live scrape or <b>🎲 Shuffle Crate</b> to dig deeper into unplayed tracks.
      </div>
      <div class="token-row" id="tokenSetupRow" style="display:none;">
        <input type="password" id="ghTokenInput" placeholder="Paste GitHub Fine-Grained Token (Actions: Read & Write)" />
        <button class="dig-action-btn primary" id="saveTokenAndRunBtn">Save &amp; Run</button>
        <a class="dig-action-btn" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">Create Token &nearr;</a>
      </div>
    </div>

    <div class="summary-bar">
      <span id="countLabel">0 tracks</span>
      <button class="re-download-link" id="downloadOwnedBtn">Save owned_tracks.json for GitHub</button>
      <span class="synced-group">
        <span id="ownedLabel">0 synced</span>
        <button class="reset-sync-link" id="resetSyncBtn" title="Clear browser-cached folder sync">(Reset)</button>
      </span>
    </div>
    <div id="feed"></div>
  </main>

  <script>
    const DONE_KEY = "crate_radar_done_v1";
    const OWNED_KEY = "crate_radar_owned_v2";
    const GH_TOKEN_KEY = "crate_radar_gh_pat_v1";
    const REPO_OWNER = "audricsliske";
    const REPO_NAME = "crate-radar";
    const WORKFLOW_FILE = "scan.yml";

    const GENRE_FILTERS = new Set(["Dancehall", "Dubstep", "Trap", "Afro House"]);
    const PLATFORM_FILTERS = new Set(["SoundCloud", "Hypeddit", "Droploud", "Audius", "Hearthis"]);

    const AUDIO_EXT_RE = /\.(mp3|wav|flac|aiff|aif|m4a|aac|ogg|alac|wma)$/i;
    const LEADING_META_RE = /^(?:\d{1,3}(?:\s*bpm)?|\d{1,2}[abm])[\s._-]+/i;

    const STOP_WORDS = new Set([
      "extended", "original", "mix", "radio", "clean", "dirty", "intro", "outro",
      "short", "club", "instrumental", "acapella", "free", "download", "dl",
      "320", "320kbps", "kbps", "master", "mastered", "hq", "explicit",
      "feat", "ft", "featuring", "vs", "and", "the", "a", "an", "of", "in", "on",
      "out", "now", "hypeddit", "droploud", "soundcloud", "sc", "audius", "hearthis",
      "bpm", "official", "audio", "video", "premiere", "release", "version", "ver"
    ]);

    const REMIX_MODIFIERS = new Set([
      "flip", "bootleg", "vip", "remix", "rework", "mashup", "refix", "redrum"
    ]);

    let allTracks = [];
    let shuffledOrder = null;
    let repoOwnedTitles = [];
    let localOwnedTitles = [];
    let combinedOwnedProfiles = [];
    let activeFilter = "ALL";
    let showDone = false;
    let hideDuplicates = false;
    let playingTrackKey = null;
    let latestOwnedPayload = null;
    let pollTimer = null;

    function foldAscii(text) {
      return (text || "").normalize("NFD").replace(/[̀-ͯ]/g, "");
    }

    function tokenizeTitle(text) {
      let s = foldAscii(text).replace(/\s+/g, " ").trim();
      s = s.replace(AUDIO_EXT_RE, "");
      while (true) {
        const nxt = s.replace(LEADING_META_RE, "");
        if (nxt === s) break;
        s = nxt;
      }
      s = s.replace(/(radio|short)\s+edit/gi, " ");
      s = s.replace(/\d{1,2}[abm]/gi, " ");
      s = s.replace(/\d{2,3}\s*bpm/gi, " ");
      s = s.toLowerCase().replace(/&/g, " ");

      const rawTokens = s.match(/[a-z0-9]+/g) || [];
      const core = new Set();
      const mods = new Set();
      const all = new Set();

      for (const tok of rawTokens) {
        if (STOP_WORDS.has(tok)) continue;
        if (tok.length === 1 && !/^\d$/.test(tok)) continue;
        all.add(tok);
        if (REMIX_MODIFIERS.has(tok)) mods.add(tok);
        else core.add(tok);
      }

      const flat = [...all].sort().join("");
      return { core, mods, flat };
    }

    function getUniqueMergedTitles() {
      const seen = new Set();
      const merged = [];
      for (const title of [...repoOwnedTitles, ...localOwnedTitles]) {
        const info = tokenizeTitle(title);
        if (info.core.size > 0 && !seen.has(info.flat)) {
          seen.add(info.flat);
          merged.push(title);
        }
      }
      return merged.sort((a, b) => a.localeCompare(b));
    }

    function rebuildOwnedProfiles() {
      const seen = new Set();
      const profiles = [];
      for (const title of [...repoOwnedTitles, ...localOwnedTitles]) {
        const info = tokenizeTitle(title);
        if (info.core.size > 0 && !seen.has(info.flat)) {
          seen.add(info.flat);
          profiles.push(info);
        }
      }
      combinedOwnedProfiles = profiles;
    }

    function setsEqual(a, b) {
      if (a.size !== b.size) return false;
      for (const item of a) {
        if (!b.has(item)) return false;
      }
      return true;
    }

    function isDuplicateTrack(track) {
      if (track.is_duplicate) return true;
      const tInfo = tokenizeTitle(track.title);
      if (tInfo.core.size === 0) return false;

      for (const oInfo of combinedOwnedProfiles) {
        if (tInfo.flat && tInfo.flat === oInfo.flat) return true;
        if (!setsEqual(tInfo.mods, oInfo.mods)) continue;

        let commonCount = 0;
        let singleCommon = "";
        for (const tok of tInfo.core) {
          if (oInfo.core.has(tok)) {
            commonCount++;
            singleCommon = tok;
          }
        }
        const minLen = Math.min(tInfo.core.size, oInfo.core.size);
        if (minLen >= 2 && commonCount >= 2 && (commonCount / minLen) >= 0.80) {
          return true;
        }
        if (minLen === 1 && commonCount === 1 && singleCommon.length >= 6) {
          return true;
        }
      }
      return false;
    }

    function getDoneSet() {
      try {
        return new Set(JSON.parse(localStorage.getItem(DONE_KEY) || "[]"));
      } catch {
        return new Set();
      }
    }

    function saveDoneSet(set) {
      localStorage.setItem(DONE_KEY, JSON.stringify([...set]));
    }

    function loadLocalOwnedTitles() {
      try {
        const parsed = JSON.parse(localStorage.getItem(OWNED_KEY) || "[]");
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveLocalOwnedTitles(arr) {
      localStorage.setItem(OWNED_KEY, JSON.stringify(arr));
    }

    function toggleDone(trackKey) {
      const done = getDoneSet();
      if (done.has(trackKey)) done.delete(trackKey);
      else done.add(trackKey);
      saveDoneSet(done);
      render();
    }

    function togglePlay(trackKey) {
      playingTrackKey = (playingTrackKey === trackKey) ? null : trackKey;
      render();
    }

    function getPlatformBadgeClass(platform) {
      const p = (platform || "").toLowerCase();
      if (p === "droploud") return "badge-droploud";
      if (p === "soundcloud") return "badge-soundcloud";
      if (p === "audius") return "badge-audius";
      if (p === "hearthis") return "badge-hearthis";
      return "badge-hypeddit";
    }

    function buildPlayerHTML(track) {
      const encodedTitle = encodeURIComponent(track.title);
      const scSearch = `https://soundcloud.com/search/sounds?q=${encodedTitle}`;
      const ytSearch = `https://www.youtube.com/results?search_query=${encodedTitle}`;

      if (track.preview_type === "soundcloud" && track.preview_url) {
        const widgetSrc =
          `https://w.soundcloud.com/player/?url=${encodeURIComponent(track.preview_url)}` +
          `&color=%2300e5ff&auto_play=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false`;
        return `<div class="player-box"><iframe height="110" scrolling="no" allow="autoplay" src="${widgetSrc}"></iframe></div>`;
      }

      if (track.preview_type === "audio" && track.preview_url) {
        return `<div class="player-box"><audio controls autoplay preload="none" src="${track.preview_url}"></audio></div>`;
      }

      if (track.preview_type === "spotify" && track.preview_url) {
        return `<div class="player-box"><iframe height="80" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" src="${track.preview_url}"></iframe></div>`;
      }

      if (track.preview_type === "youtube" && track.preview_url) {
        return `<div class="player-box"><iframe height="165" allow="autoplay; encrypted-media" allowfullscreen src="${track.preview_url}"></iframe></div>`;
      }

      return `
        <div class="player-box">
          <div class="fallback-listen">
            <span>Direct stream locked by gate — play via:</span>
            <div class="fallback-links">
              <a class="mini-link" href="${scSearch}" target="_blank" rel="noopener noreferrer">SoundCloud &nearr;</a>
              <a class="mini-link" href="${ytSearch}" target="_blank" rel="noopener noreferrer">YouTube &nearr;</a>
              <a class="mini-link" href="${track.url}" target="_blank" rel="noopener noreferrer">Gate Player &nearr;</a>
            </div>
          </div>
        </div>`;
    }

    async function copyText(text, btn) {
      try {
        await navigator.clipboard.writeText(text);
        const orig = btn.textContent;
        btn.textContent = "Copied!";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = orig;
          btn.classList.remove("copied");
        }, 1200);
      } catch {
        prompt("Copy track name:", text);
      }
    }

    function triggerOwnedDownload(payload) {
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "owned_tracks.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    async function fetchLatestFeed() {
      const digBtn = document.getElementById("digMoreBtn");
      digBtn.classList.add("spinning");
      const prevCount = allTracks.length;
      try {
        const [tracksRes, ownedRes] = await Promise.all([
          fetch("./tracks.json?v=" + Date.now(), { cache: "no-store" }),
          fetch("./owned_tracks.json?v=" + Date.now(), { cache: "no-store" }).catch(() => null)
        ]);
        const data = await tracksRes.json();
        allTracks = data.tracks || [];
        document.getElementById("lastUpdated").textContent = data.last_updated || "Ready";

        if (ownedRes && ownedRes.ok) {
          const ownedData = await ownedRes.json();
          const list = Array.isArray(ownedData) ? ownedData : (ownedData.tracks || []);
          repoOwnedTitles = list.map(item => typeof item === "string" ? item : (item.title || "")).filter(Boolean);
        }
        rebuildOwnedProfiles();
        render();
        const diff = allTracks.length - prevCount;
        return diff > 0 ? `+${diff} new tracks loaded!` : `Feed up to date (${allTracks.length} tracks in crate).`;
      } catch (err) {
        document.getElementById("lastUpdated").textContent = "Waiting for first scan";
        return "Could not fetch feed yet.";
      } finally {
        setTimeout(() => digBtn.classList.remove("spinning"), 450);
      }
    }

    async function triggerGitHubScan(token) {
      const statusEl = document.getElementById("digStatusText");
      const digBtn = document.getElementById("digMoreBtn");
      digBtn.classList.add("spinning");
      statusEl.innerHTML = "Triggering live scrape across Hypeddit, Droploud, SoundCloud, Audius &amp; Hearthis...";

      try {
        const res = await fetch(
          `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_FILE}/dispatches`,
          {
            method: "POST",
            headers: {
              "Accept": "application/vnd.github+json",
              "Authorization": `Bearer ${token}`,
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ ref: "main" })
          }
        );

        if (res.status === 401 || res.status === 403 || res.status === 404) {
          localStorage.removeItem(GH_TOKEN_KEY);
          document.getElementById("tokenSetupRow").style.display = "flex";
          digBtn.classList.remove("spinning");
          statusEl.innerHTML = "Token rejected or missing <b>Actions: Read &amp; write</b> permission. Paste a valid token below or click <b>GitHub Actions ↗</b>.";
          return;
        }

        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }

        statusEl.innerHTML = "<strong>Scan started!</strong> Digging Dancehall, Dubstep, Trap &amp; Afro House (~45s) — auto-refreshing when done...";
        let attempts = 0;
        if (pollTimer) clearInterval(pollTimer);

        pollTimer = setInterval(async () => {
          attempts++;
          try {
            const runsRes = await fetch(
              `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_FILE}/runs?per_page=1`,
              {
                headers: {
                  "Accept": "application/vnd.github+json",
                  "Authorization": `Bearer ${token}`
                }
              }
            );
            if (runsRes.ok) {
              const runsData = await runsRes.json();
              const latest = runsData.workflow_runs && runsData.workflow_runs[0];
              if (latest) {
                if (latest.status === "completed") {
                  clearInterval(pollTimer);
                  digBtn.classList.remove("spinning");
                  statusEl.innerHTML = "<strong>Scrape complete!</strong> Waiting 5s for GitHub Pages to publish...";
                  setTimeout(async () => {
                    const msg = await fetchLatestFeed();
                    statusEl.innerHTML = `<strong>Done!</strong> ${msg}`;
                  }, 5000);
                  return;
                } else {
                  statusEl.innerHTML = `<strong>Scanning (${latest.status})...</strong> Checking again in 5s (${attempts * 5}s elapsed)`;
                }
              }
            }
          } catch {}

          if (attempts >= 28) {
            clearInterval(pollTimer);
            digBtn.classList.remove("spinning");
            const msg = await fetchLatestFeed();
            statusEl.innerHTML = msg;
          }
        }, 5000);
      } catch (err) {
        digBtn.classList.remove("spinning");
        statusEl.innerHTML = "Could not trigger API directly. Click <b>GitHub Actions ↗</b> → <b>Run workflow</b>.";
      }
    }

    document.getElementById("digMoreBtn").addEventListener("click", async () => {
      const drawer = document.getElementById("digDrawer");
      drawer.classList.add("open");
      const msg = await fetchLatestFeed();
      document.getElementById("digStatusText").innerHTML =
        `${msg} Click <b>⚡ Pull Fresh Drops Now</b> to scrape new releases or <b>🎲 Shuffle Crate</b> to dig deeper.`;
    });

    document.getElementById("closeDigDrawerBtn").addEventListener("click", () => {
      document.getElementById("digDrawer").classList.remove("open");
    });

    document.getElementById("triggerLiveScrapeBtn").addEventListener("click", () => {
      const savedToken = localStorage.getItem(GH_TOKEN_KEY);
      if (savedToken) {
        triggerGitHubScan(savedToken);
      } else {
        const row = document.getElementById("tokenSetupRow");
        row.style.display = row.style.display === "none" ? "flex" : "none";
        document.getElementById("digStatusText").innerHTML =
          "For 1-click scraping from this page, paste a GitHub token with <b>Actions: Read &amp; write</b> below—or click <b>GitHub Actions ↗</b> → <b>Run workflow</b>.";
      }
    });

    document.getElementById("saveTokenAndRunBtn").addEventListener("click", () => {
      const val = document.getElementById("ghTokenInput").value.trim();
      if (!val) return;
      localStorage.setItem(GH_TOKEN_KEY, val);
      document.getElementById("ghTokenInput").value = "";
      document.getElementById("tokenSetupRow").style.display = "none";
      triggerGitHubScan(val);
    });

    document.getElementById("shuffleCrateBtn").addEventListener("click", () => {
      const btn = document.getElementById("shuffleCrateBtn");
      if (!allTracks.length) return;
      const copy = [...allTracks];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      shuffledOrder = copy;
      btn.classList.add("active-shuffle");
      btn.textContent = "🎲 Shuffled (Click to Re-Dig)";
      document.getElementById("digStatusText").innerHTML =
        "<strong>Crate shuffled!</strong> Surfacing random unheard tracks from your crate.";
      render();
    });

    document.getElementById("syncFolderBtn").addEventListener("click", () => {
      document.getElementById("folderPicker").click();
    });

    document.getElementById("importJsonBtn").addEventListener("click", () => {
      document.getElementById("jsonPicker").click();
    });

    document.getElementById("downloadOwnedBtn").addEventListener("click", () => {
      if (latestOwnedPayload) triggerOwnedDownload(latestOwnedPayload);
    });

    document.getElementById("resetSyncBtn").addEventListener("click", () => {
      localOwnedTitles = [];
      saveLocalOwnedTitles([]);
      rebuildOwnedProfiles();
      render();
    });

    document.getElementById("jsonPicker").addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        const list = Array.isArray(data) ? data : (data.tracks || []);
        const titles = list.map(item => typeof item === "string" ? item : (item.title || "")).filter(Boolean);
        if (!titles.length) {
          alert("That JSON file did not contain any tracks.");
          return;
        }
        localOwnedTitles = [...localOwnedTitles, ...titles];
        const mergedAll = getUniqueMergedTitles();
        localOwnedTitles = mergedAll;
        saveLocalOwnedTitles(mergedAll);
        rebuildOwnedProfiles();
        latestOwnedPayload = {
          updated_at: new Date().toISOString(),
          count: mergedAll.length,
          tracks: mergedAll
        };
        document.getElementById("downloadOwnedBtn").classList.add("visible");
        render();
      } catch (err) {
        alert("Could not read that JSON file. Make sure you picked owned_tracks.json.");
      }
      e.target.value = "";
    });

    document.getElementById("folderPicker").addEventListener("change", (e) => {
      const files = Array.from(e.target.files || []);
      const newlyScanned = [];

      for (const file of files) {
        if (!AUDIO_EXT_RE.test(file.name)) continue;
        const cleanName = file.name.replace(AUDIO_EXT_RE, "").trim();
        if (cleanName) newlyScanned.push(cleanName);
      }

      if (!newlyScanned.length) {
        alert("No audio files (.mp3, .wav, .flac, .m4a, .aiff) were found in that folder.");
        return;
      }

      localOwnedTitles = [...localOwnedTitles, ...newlyScanned];
      const mergedAll = getUniqueMergedTitles();
      localOwnedTitles = mergedAll;
      saveLocalOwnedTitles(mergedAll);
      rebuildOwnedProfiles();

      latestOwnedPayload = {
        updated_at: new Date().toISOString(),
        count: mergedAll.length,
        tracks: mergedAll
      };

      triggerOwnedDownload(latestOwnedPayload);
      document.getElementById("downloadOwnedBtn").classList.add("visible");

      e.target.value = "";
      render();
    });

    function render() {
      const feed = document.getElementById("feed");
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const doneSet = getDoneSet();
      const sourceList = shuffledOrder || allTracks;

      const totalDupesInFeed = sourceList.filter(t => isDuplicateTrack(t)).length;

      const dupesBtn = document.getElementById("toggleDupesBtn");
      dupesBtn.textContent = (hideDuplicates ? "Show Dupes (" : "Hide Dupes (") + totalDupesInFeed + ")";
      dupesBtn.classList.toggle("active", hideDuplicates);

      const hiddenBtn = document.getElementById("toggleHiddenBtn");
      hiddenBtn.textContent = (showDone ? "Hide Done (" : "Done (") + doneSet.size + ")";
      hiddenBtn.classList.toggle("active-cyan", showDone);

      document.getElementById("ownedLabel").textContent =
        `${combinedOwnedProfiles.length} synced`;
      document.getElementById("resetSyncBtn").classList.toggle("visible", localOwnedTitles.length > 0);

      const filtered = sourceList.filter(t => {
        const isDupe = isDuplicateTrack(t);
        if (hideDuplicates && isDupe && activeFilter !== "DUPLICATES") return false;

        const key = t.url || t.title;
        const isDone = doneSet.has(key);
        if (!showDone && isDone) return false;

        if (activeFilter === "DUPLICATES" && !isDupe) return false;
        if (activeFilter === "EDITS" && !t.is_edit) return false;
        if (GENRE_FILTERS.has(activeFilter) && t.genre !== activeFilter) return false;
        if (PLATFORM_FILTERS.has(activeFilter) && t.platform !== activeFilter) return false;

        if (query) {
          const hay = `${t.title} ${t.genre} ${t.platform} ${isDupe ? "duplicate" : ""}`.toLowerCase();
          if (!hay.includes(query)) return false;
        }
        return true;
      });

      document.getElementById("countLabel").textContent =
        `${filtered.length} track${filtered.length === 1 ? "" : "s"}` + (shuffledOrder ? " (shuffled)" : "");

      if (!filtered.length) {
        feed.innerHTML = `
          <div class="empty">
            <strong>No tracks in this view</strong>
            Try switching filters or click <b>↻ Dig More</b> → <b>⚡ Pull Fresh Drops Now</b> to scrape fresh tracks.
          </div>`;
        return;
      }

      feed.innerHTML = "";
      filtered.forEach(track => {
        const key = track.url || track.title;
        const isDone = doneSet.has(key);
        const isDupe = isDuplicateTrack(track);
        const isPlaying = (playingTrackKey === key);

        const card = document.createElement("div");
        card.className =
          "card" +
          (isPlaying ? " is-playing" : "") +
          (isDupe ? " is-duplicate" : "") +
          (isDone ? " is-hidden" : "");

        const platClass = getPlatformBadgeClass(track.platform);
        const openLabel = (track.platform === "Hypeddit" || track.platform === "Droploud")
          ? "Open Gate &nearr;"
          : "Open Track &nearr;";

        card.innerHTML = `
          <div class="meta">
            <span class="badge ${platClass}">${track.platform}</span>
            <span class="badge badge-genre">${track.genre}</span>
            ${track.is_edit ? '<span class="badge badge-edit">Flip / Edit</span>' : ""}
            ${isDupe ? '<span class="badge badge-duplicate">Duplicate</span>' : ""}
            <span class="time">${track.found_at || ""}</span>
          </div>
          <div class="track-title"></div>
          ${isPlaying ? buildPlayerHTML(track) : ""}
          <div class="actions">
            <button class="btn btn-listen ${isPlaying ? "playing" : ""}">${isPlaying ? "■ Stop" : "▶ Listen"}</button>
            <button class="btn btn-copy">Copy Name</button>
            <a class="btn btn-open" target="_blank" rel="noopener noreferrer">${openLabel}</a>
            <button class="btn btn-done">${isDone ? "Restore" : "✓ Done"}</button>
          </div>
        `;

        card.querySelector(".track-title").textContent = track.title;

        const listenBtn = card.querySelector(".btn-listen");
        listenBtn.onclick = () => togglePlay(key);

        const copyBtn = card.querySelector(".btn-copy");
        copyBtn.onclick = () => copyText(track.title, copyBtn);

        const openLink = card.querySelector(".btn-open");
        openLink.href = track.url;

        const doneBtn = card.querySelector(".btn-done");
        doneBtn.onclick = () => toggleDone(key);

        feed.appendChild(card);
      });
    }

    document.getElementById("filterPills").addEventListener("click", e => {
      if (!e.target.classList.contains("pill")) return;
      document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
      e.target.classList.add("active");
      activeFilter = e.target.dataset.filter;
      shuffledOrder = null;
      const shuffleBtn = document.getElementById("shuffleCrateBtn");
      shuffleBtn.classList.remove("active-shuffle");
      shuffleBtn.textContent = "🎲 Shuffle Crate";
      render();
    });

    document.getElementById("searchInput").addEventListener("input", render);
    document.getElementById("toggleDupesBtn").addEventListener("click", () => {
      hideDuplicates = !hideDuplicates;
      render();
    });
    document.getElementById("toggleHiddenBtn").addEventListener("click", () => {
      showDone = !showDone;
      render();
    });

    async function init() {
      localOwnedTitles = loadLocalOwnedTitles();
      await fetchLatestFeed();
    }

    init();
  </script>
</body>
</html>
